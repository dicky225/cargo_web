apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cargo-web
  template:
    metadata:
      labels:
        app: cargo-web
    spec:
      containers:
        - name: cargo-web
          image: your-registry/cargo-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: REACT_APP_API_URL
              value: "http://backend-service:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: cargo-web-service
spec:
  selector:
    app: cargo-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
