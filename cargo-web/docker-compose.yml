version: "3.8"

services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    volumes:
      - .:/app
      - /app/node_modules
    command: npm start

  backend:
    image: your-backend-image:latest
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
